{id:"c5",track:"c",title:"Leer en clave de Fa",sub:"La mano izquierda en el pentagrama",body:`
<div class="idea"><span class="eyebrow">Idea clave</span><b>La clave de Fa fija la nota Fa en la cuarta línea</b>, la que queda entre los dos puntos. Es la clave de la mano izquierda.</div>
<ul><li>Líneas, de abajo arriba: <b>Sol · Si · Re · Fa · La</b>.</li><li>Espacios: <b>La · Do · Mi · Sol</b>.</li><li>El Do central va en una línea adicional <b>encima</b> del pentagrama. Es la misma tecla que el Do central de la clave de Sol.</li></ul>
<p>En las partituras de piano clásico se leen las dos claves a la vez, una sobre otra. En jazz la mano izquierda casi siempre toca acordes leídos del cifrado, así que aquí basta con un nivel básico.</p>`,
w:(h,id)=>staffQuiz(h,{lessonId:id,clef:"bass",lo:40,hi:60,from:36,to:64,goal:10})},
{id:"c6",track:"c",title:"Pulso y figuras",sub:"Redonda, blanca, negra, corchea",body:`
<p>El <b>pulso</b> es el latido regular de la música, lo que marca el metrónomo. Las <b>figuras</b> dicen cuántos pulsos dura cada nota.</p>
<div class="tbl-wrap"><table class="t"><tr><th></th><th>Figura</th><th>Duración</th></tr>
<tr><td>${glyph(4)}</td><td>Redonda</td><td>4 pulsos</td></tr><tr><td>${glyph(2)}</td><td>Blanca</td><td>2 pulsos</td></tr><tr><td>${glyph(1)}</td><td>Negra</td><td>1 pulso</td></tr><tr><td>${glyph(.5)}</td><td>Corchea</td><td>½ pulso (dos por pulso)</td></tr><tr><td>${glyph(1,true)}</td><td>Silencio de negra</td><td>1 pulso sin sonar</td></tr></table></div>
<div class="idea"><span class="eyebrow">Idea clave</span><b>En un compás de 4/4 caben 4 negras.</b> Cuenta en voz alta «1, 2, 3, 4». Con corcheas: «1 y 2 y 3 y 4 y».</div>
<p>Escucha el patrón y luego tócalo tú tras la cuenta de 4. Puedes usar el botón grande, la barra espaciadora o tu Roland si está conectado por MIDI. La bossa nova vive en el «y» (el contratiempo), así que merece la pena dominar las corcheas pronto.</p>`,
w:(h,id)=>rhythmEx(h,{lessonId:id,goal:5})},
{id:"c7",track:"c",title:"Sostenidos, bemoles, tonos y semitonos",sub:"Las teclas negras",body:`
<ul><li><b>Semitono</b>: de una tecla a la de al lado, sea blanca o negra. Es la distancia más pequeña del piano.</li><li><b>Tono</b> = 2 semitonos.</li>
<li><b>♯ (sostenido)</b> sube un semitono. <b>♭ (bemol)</b> baja un semitono. La negra entre Do y Re es Do♯ y también Re♭: mismo sonido, dos nombres.</li></ul>
<div class="idea"><span class="eyebrow">Idea clave</span><b>Mi–Fa y Si–Do no tienen negra en medio: ya son semitonos.</b> Por eso el dibujo de negras va en grupos de 2 y 3.</div>
<p>En el cifrado de jazz verás los dos nombres: B♭7, F♯7, E♭maj7… Este ejercicio te los pide mezclados.</p>`,
w:(h,id)=>nameQuiz(h,{lessonId:id,from:48,to:83,goal:12,title:"Ejercicio: teclas negras",pool:[[1,"Do♯",0,1],[1,"Re♭",2,-1],[3,"Re♯",2,1],[3,"Mi♭",4,-1],[6,"Fa♯",5,1],[6,"Sol♭",7,-1],[8,"Sol♯",7,1],[8,"La♭",9,-1],[10,"La♯",9,1],[10,"Si♭",11,-1]].map(([p,s,b,d])=>({pc:p,show:s,sub:"Toca esta nota en cualquier altura",hint:`Busca ${SOL[b]} y ${d>0?"sube a la tecla de la derecha":"baja a la tecla de la izquierda"}.`}))})},
{id:"c8",track:"c",title:"La escala de Do mayor",sub:"Paso del pulgar",body:`
<p>Una escala mayor sigue siempre el mismo patrón de distancias: <b>T T S T T T S</b> (T = tono, S = semitono). Empezando en Do sale con teclas blancas solamente.</p>
<div class="idea"><span class="eyebrow">Idea clave</span><b>Mano derecha al subir: 1 2 3 · 1 2 3 4 5.</b> Tras el Mi (dedo 3), el pulgar pasa por debajo hasta el Fa. <b>Al bajar: 5 4 3 2 1 · 3 2 1</b>: el dedo 3 cruza por encima del pulgar.</div>
<p>Practícala con metrónomo a 60, una nota por pulso. Mejor lenta y regular que rápida y desigual. Cuando salga sin errores tres días seguidos, sube a 66.</p>`,
w:(h,id)=>seqEx(h,{lessonId:id,title:"Ejercicio: escala de Do, mano derecha",help:"Sigue la tecla marcada y su número de dedo. Al llegar arriba, baja.",from:57,to:76,goal:3,bpm:80,steps:fingerSteps([60,62,64,65,67,69,71,72,71,69,67,65,64,62,60],[1,2,3,1,2,3,4,5,4,3,2,1,3,2,1])})},
{id:"c9",track:"c",title:"Intervalos de oído",sub:"Distancias entre dos notas",body:`
<p>Un <b>intervalo</b> es la distancia entre dos notas. Reconocerlos de oído te ayuda a sacar melodías y a entender por qué un acorde suena como suena.</p>
<div class="tbl-wrap"><table class="t"><tr><th>Intervalo</th><th>Semitonos</th><th>Para recordarlo</th></tr>
<tr><td>2ª mayor</td><td>2</td><td>primeras notas de «Cumpleaños feliz»</td></tr><tr><td>3ª menor</td><td>3</td><td>comienzo de «Greensleeves»</td></tr><tr><td>3ª mayor</td><td>4</td><td>comienzo de «When the Saints Go Marching In»</td></tr>
<tr><td>4ª justa</td><td>5</td><td>comienzo de la marcha nupcial de Wagner</td></tr><tr><td>5ª justa</td><td>7</td><td>«Estrellita, ¿dónde estás?» (Do–Do–Sol)</td></tr><tr><td>6ª mayor</td><td>9</td><td>comienzo de «My Bonnie»</td></tr><tr><td>8ª</td><td>12</td><td>primer salto de «Over the Rainbow»</td></tr></table></div>
<div class="idea"><span class="eyebrow">Idea clave</span><b>La 3ª mayor y la 3ª menor deciden si un acorde suena mayor o menor.</b> Es el intervalo que más vas a usar.</div>`,
w:(h,id)=>earQuiz(h,{lessonId:id,title:"Ejercicio: ¿qué intervalo suena?",ask:"Escucha dos notas, una tras otra.",goal:12,base:()=>55+Math.floor(Math.random()*10),
  items:[[2,"2ª mayor","Como «Cumpleaños feliz»."],[3,"3ª menor","Como «Greensleeves»."],[4,"3ª mayor","Como «When the Saints»."],[5,"4ª justa","Como la marcha nupcial."],[7,"5ª justa","Como «Estrellita»."],[9,"6ª mayor","Como «My Bonnie»."],[12,"8ª","Como «Over the Rainbow»."]].map(([s,l,ref])=>({id:String(s),label:l,ref,
    play:b=>{const t=audio().currentTime+.05;playNote(b,t,1);playNote(b+s,t+.75,1.2);},marks:(b,kb)=>{kb.mark(b,"1");kb.mark(b+s,String(s),"guide");kb.center([b,b+s]);}}))})},
{id:"c10",track:"c",title:"Acordes mayores y menores",sub:"Tríadas: 1 – 3 – 5",body:`
<p>Un acorde son tres o más notas a la vez. La <b>tríada</b> se forma con fundamental, tercera y quinta (1–3–5), saltando una tecla blanca entre cada nota.</p>
<ul><li><b>Mayor</b>: 4 semitonos + 3 semitonos. Do mayor = Do–Mi–Sol.</li><li><b>Menor</b>: 3 + 4. Do menor = Do–Mi♭–Sol.</li></ul>
<div class="idea"><span class="eyebrow">Idea clave</span><b>Solo cambia la tercera.</b> Bájala un semitono y el acorde mayor se vuelve menor.</div>
<div class="try">Toca Do mayor con la derecha (dedos 1–3–5). Baja solo el dedo 3 a Mi♭. Vuelve. Haz lo mismo sobre Re, Mi, Fa, Sol y La.</div>`,
w:(h,id)=>buildQuiz(h,{lessonId:id,title:"Ejercicio: construye el acorde",goal:10,targets:[R(0),R(1),R(2),R(3),R(4),R(5),R(6,-1)].flatMap(r=>[{r,type:"maj"},{r,type:"m"}])})},
{id:"j1",track:"j",title:"El cifrado americano",sub:"Leer acordes como en un lead sheet",body:`
<p>En el jazz los acordes se escriben con <b>letra + símbolo</b> encima de la melodía. Es lo que vas a leer en la partitura de Wave.</p>
<div class="tbl-wrap"><table class="t"><tr><th>Símbolo</th><th>Se lee</th><th>Notas sobre Do</th></tr>
<tr><td class="sym">C</td><td>Do mayor</td><td>Do Mi Sol</td></tr><tr><td class="sym">Cm · C–</td><td>Do menor</td><td>Do Mi♭ Sol</td></tr><tr><td class="sym">C7</td><td>Do séptima (dominante)</td><td>Do Mi Sol Si♭</td></tr>
<tr><td class="sym">Cmaj7 · CΔ</td><td>Do séptima mayor</td><td>Do Mi Sol Si</td></tr><tr><td class="sym">Cm7 · C–7</td><td>Do menor séptima</td><td>Do Mi♭ Sol Si♭</td></tr><tr><td class="sym">Cm7♭5 · Cø</td><td>Do semidisminuido</td><td>Do Mi♭ Sol♭ Si♭</td></tr>
<tr><td class="sym">C°7</td><td>Do disminuido</td><td>Do Mi♭ Sol♭ Si𝄫 (= La)</td></tr><tr><td class="sym">C6 · Cm6</td><td>Do sexta / menor sexta</td><td>añade La</td></tr></table></div>
<div class="idea"><span class="eyebrow">Idea clave</span><b>«7» a secas es la séptima menor (♭7) sobre un acorde mayor: el acorde de dominante.</b> «maj7» o Δ es la séptima mayor. Confundirlos es el error más común al empezar.</div>`,
w:(h)=>explorer(h,{title:"Explorador de acordes",types:["maj","m","7","maj7","m7","m7b5","dim7","6","m6"]})},
{id:"j2",track:"j",title:"Acordes de séptima",sub:"maj7, 7 y m7 de oído y en el teclado",body:`
<p>Añade otra tercera encima de la tríada y tienes un acorde de cuatro notas: <b>1–3–5–7</b>. El jazz y la bossa nova usan casi siempre estos acordes.</p>
<div class="tbl-wrap"><table class="t"><tr><th>Tipo</th><th>Fórmula</th><th>Cómo suena</th></tr>
<tr><td class="sym">maj7</td><td>1 3 5 7</td><td>abierto, tranquilo</td></tr><tr><td class="sym">7</td><td>1 3 5 ♭7</td><td>tenso, pide resolver</td></tr><tr><td class="sym">m7</td><td>1 ♭3 5 ♭7</td><td>suave, menor</td></tr>
<tr><td class="sym">m7♭5</td><td>1 ♭3 ♭5 ♭7</td><td>inestable, prepara un menor</td></tr><tr><td class="sym">°7</td><td>1 ♭3 ♭5 𝄫7</td><td>muy inestable, de paso</td></tr></table></div>
<div class="idea"><span class="eyebrow">Idea clave</span><b>Los tres básicos son maj7, 7 y m7.</b> Con ellos ya se tocan muchísimas progresiones de bossa nova.</div>`,
w:(h,id)=>{earQuiz(h,{lessonId:id,title:"Ejercicio 1: ¿qué tipo de acorde suena?",ask:"Escucha el arpegio y luego el acorde.",goal:10,from:48,to:76,base:()=>ROOT_PC[[0,2,3,5,7,9][Math.floor(Math.random()*6)]],
  items:[["maj7","maj7 (séptima mayor)","Brillante y en calma."],["7","7 (dominante)","Tenso: quiere ir a otro acorde."],["m7","m7 (menor séptima)","Suave y algo melancólico."]].map(([t,l,ref])=>({id:t,label:l,ref,
    play:r=>{const t0=audio().currentTime+.05,vs=voice(r,t,"fund");vs.forEach((x,i)=>playNote(x.m,t0+i*.28,1.2));vs.forEach(x=>playNote(x.m,t0+vs.length*.28+.2,1.8));},
    marks:(r,kb)=>{const vs=voice(r,t,"fund");vs.forEach(x=>kb.mark(x.m,x.lab,isGuide(x.lab)?"guide":""));kb.center(vs.map(x=>x.m));}}))});
  buildQuiz(h,{title:"Ejercicio 2: construye el acorde de séptima",goal:8,targets:[R(0),R(1),R(3),R(4),R(5)].flatMap(r=>[{r,type:"maj7"},{r,type:"7"},{r,type:"m7"}])});}},
{id:"j3",track:"j",title:"El ii – V – I",sub:"La progresión central del jazz",body:`
<p>Es la progresión más frecuente del jazz y de la bossa nova. Los números romanos son grados de la escala: <b>II</b> menor séptima, <b>V</b> dominante, <b>I</b> séptima mayor.</p>
<ul><li>En Do: <b>Dm7 – G7 – Cmaj7</b></li><li>En Re, la tonalidad de Wave: <b>Em7 – A7 – Dmaj7</b></li></ul>
<div class="idea"><span class="eyebrow">Idea clave</span><b>Las notas guía son la 3ª y la 7ª de cada acorde.</b> De un acorde al siguiente se mueven un semitono o se quedan quietas; por eso el ii–V–I suena tan encadenado. En el teclado salen en verde.</div>
<div class="try">Toca solo las notas guía con la derecha mientras la izquierda toca la fundamental: Em7 (Sol + Re) → A7 (Sol + Do♯) → Dmaj7 (Fa♯ + Do♯). Fíjate en lo poco que se mueve la mano.</div>`,
w:(h)=>progEx(h,{})},
{id:"j4",track:"j",title:"Voicings para el piano",sub:"Shells y acordes sin fundamental",body:`
<p>Un <b>voicing</b> es la manera de repartir las notas del acorde en el teclado. Tocar todo en posición fundamental suena pesado y obliga a saltar.</p>
<ul><li><b>Shell</b> (cáscara): fundamental + 3ª + 7ª. Las tres notas que definen el acorde. La izquierda toca el shell y la derecha la melodía.</li>
<li><b>Sin fundamental</b> (rootless): 3–5–7–9 (forma A) o 7–9–3–5 (forma B). La fundamental la pone el contrabajo. Es el sonido típico del piano de jazz y de bossa.</li></ul>
<div class="idea"><span class="eyebrow">Idea clave</span><b>Para tocar Wave tú solo, empieza con shells en la izquierda y la melodía en la derecha.</b> Los voicings sin fundamental llegan después, cuando toques con acompañamiento grabado o con otros músicos.</div>`,
w:(h)=>explorer(h,{title:"Explorador de voicings",types:["maj7","7","m7","m6","7b9","m7b5","maj9","m9","9"],voicings:["shell","A","B","fund"]})},
{id:"j5",track:"j",title:"El ritmo de bossa nova",sub:"Bajo regular, acorde sincopado",body:`
<p>La bossa nova nace en Río de Janeiro a finales de los años 50: armonía de jazz con un ritmo derivado de la samba, más suave y tranquilo.</p>
<ul><li><b>Mano izquierda (bajo)</b>: fundamental en el tiempo 1 y quinta en el 3. La versión «bossa» anticipa cada nota con una corchea, lo que da el balanceo.</li>
<li><b>Mano derecha (acorde)</b>: un patrón sincopado de dos compases. Aquí tienes una versión simplificada basada en la clave de bossa.</li></ul>
<div class="idea"><span class="eyebrow">Idea clave</span><b>El bajo va regular y la mano derecha va a contratiempo.</b> Aprende cada mano por separado entre 56 y 72 de tempo, y júntalas solo cuando las dos salgan sin pensar.</div>
<div class="try">Con el patrón sonando, toca solo el bajo de la izquierda en tu piano. Después, apaga «Bajo» y toca tú la mano derecha en los cuadros marcados.</div>`,
w:(h)=>grooveEx(h,{})},
{id:"j6",track:"j",title:"Camino a Wave",sub:"Plan realista y vocabulario",body:`
<p><b>Wave</b> (Antônio Carlos Jobim, 1967) es una bossa nova en <b>Re mayor</b>. Su armonía es rica: acordes de séptima mayor, ii–V que cambian de tonalidad, dominantes con tensiones como la ♭9, disminuidos de paso y el paso de mayor a menor sobre el mismo acorde.</p>
<div class="idea"><span class="eyebrow">Te lo digo claro</span><b>Es una meta excelente, pero de nivel intermedio.</b> Con 20–30 minutos al día, calcula de forma orientativa entre <b>6 y 12 meses</b> para una versión sencilla (melodía con la derecha y shells con la izquierda). Con profesor, algo menos.</div>
<div class="tbl-wrap"><table class="t"><tr><th>Fase</th><th>Cuándo</th><th>Qué</th></tr>
<tr><td>1</td><td>semanas 1–6</td><td>Fundamentos completos (empezando por «Antes de empezar»): lectura en clave de Sol, escala de Do, tríadas.</td></tr>
<tr><td>2</td><td>meses 2–4</td><td>Séptimas, ii–V–I en Re, Sol y Do; shells con la izquierda.</td></tr>
<tr><td>3</td><td>meses 4–8</td><td>Ritmo de bossa por manos separadas y juntas; melodías fáciles con acordes.</td></tr>
<tr><td>4</td><td>meses 6–12</td><td><b>Wave, versión simple</b>: melodía + shells a tempo lento. Después, ritmo de bossa en la izquierda.</td></tr></table></div>
<p>Ya tienes la partitura del Instituto Antonio Carlos Jobim (arreglo de Claus Ogerman). En la pestaña <b>Wave</b> tienes sus acordes compás a compás para practicarlos por secciones.</p>
<div class="row" style="margin:12px 0"><button class="btn pri" type="button" onclick="document.querySelector('[data-view=wave]').click()">Ir al estudio de Wave</button></div>`,
w:(h)=>{devices(h);explorer(h,{title:"Vocabulario en Re mayor",types:["maj7","m7","7","7b9","m6","dim7","m7b5","6"],voicings:["shell","A","fund"],root:R(1),type:"maj7",
  presets:[{r:R(1),type:"maj7"},{r:R(2),type:"m7"},{r:R(5),type:"7"},{r:R(5),type:"7b9"},{r:R(4),type:"maj7"},{r:R(4),type:"m6"},{r:R(1,1),type:"dim7"},{r:R(6),type:"m7"},{r:R(3,1),type:"7"}]});}}
];
const TRACKS={c:{name:"Fundamentos",long:"Lenguaje musical clásico",desc:"Teclado, lectura en clave de Sol y Fa, ritmo, escalas, oído y acordes básicos. Es la base de todo lo demás."},
  j:{name:"Jazz y bossa nova",long:"Armonía moderna",desc:"Cifrado americano, acordes de séptima, ii–V–I, voicings y el ritmo de bossa, hasta las piezas que necesitas para Wave."}};


/* ---------- Wave: armonía de la partitura (arr. Claus Ogerman) ---------- */
const QMAP={"m7":"m7","7(13)":"13","maj7(9)":"maj9","dim7":"dim7","7(♭9)":"7b9","maj7":"maj7","m6":"m6","7(♭13)":"7b13","7(9)":"9","7sus4":"7sus4","7":"7","7sus4(9)":"9sus4","7(♯5)":"7#5","(add9)":"add9"};
function parseChord(txt){
  const [main,slash]=txt.split("/"),mm=main.match(/^([A-G])([♭♯]?)(.*)$/);
  const acc=x=>x==="♭"?-1:x==="♯"?1:0,rt=R(L.indexOf(mm[1]),acc(mm[2]));
  const t=QMAP[mm[3]];let bass=null;if(slash){const bm=slash.match(/^([A-G])([♭♯]?)$/);bass=R(L.indexOf(bm[1]),acc(bm[2]));}
  return{txt,r:rt,type:t,bass,q:mm[3],slash};
}
const VAMP=["Dm7","G7(13)"],AFORM=[["Dmaj7(9)"],["B♭dim7"],["Am7"],["D7(♭9)"],["Gmaj7"],["Gm6"],["F♯7(13)","F♯7(♭13)"],["B7(9)","B7(♭9)"],["E7sus4","E7"],["B♭7(9)","A7"],["Dm7","G7"],["Dm7","G7"]];
const WAVE=[];
const addBars=(start,list)=>list.forEach((ch,i)=>WAVE.push({n:start+i,ch:ch.map(parseChord)}));
addBars(1,[[]]);addBars(2,[VAMP,VAMP,VAMP,VAMP]);addBars(6,AFORM);addBars(18,AFORM);
addBars(30,[["Gm7"],["Gm6/B♭"],["Am7"],["Am7"],["B♭7sus4(9)"],["Fm6/A♭"],["Gm7"],["A7(♯5)"]]);
addBars(38,AFORM);addBars(50,[VAMP,VAMP,VAMP,VAMP,VAMP,VAMP,VAMP,VAMP]);addBars(58,[["D(add9)"]]);
const WSECS=[
  {id:"intro",n:"Intro",a:1,b:5,note:"<b>Vaivén Dm7 – G7(13) en cada compás.</b> Es lo primero que puedes tocar: dos acordes que se mueven muy poco. El compás 1 no tiene acorde: la melodía entra sola. Aunque la canción está en Re mayor, la intro y el final usan Dm7–G7, acordes de Do mayor, y ese contraste forma parte del color de la pieza."},
  {id:"a1",n:"A1",a:6,b:17,note:"<b>La sección A sale tres veces con los mismos acordes (A1, A2 y A3).</b> Si dominas estos 12 compases tienes casi dos tercios de la canción. Dmaj7(9) es el I. B♭dim7 es un acorde de paso hacia Am7 (en teoría se escribe Si♭–Re♭–Fa♭–La𝄫; en el teclado son Si♭, Do♯, Mi y Sol). Am7 – D7(♭9) es un ii–V que lleva a Gmaj7 (IV). Gmaj7 → Gm6: el IV mayor se vuelve menor, el gesto más típico de Jobim. Después llega una cadena de dominantes por quintas, F♯7 → B7 → E7 → A7, y el B♭7 que va justo antes de A7 sustituye a E7 (comparten la 3ª y la 7ª)."},
  {id:"a2",n:"A2",a:18,b:29,note:"<b>Igual que A1.</b> Fíjate en los cambios de una sola nota dentro del compás: en F♯7(13) → F♯7(♭13) la 13ª (Re♯) baja a Re; en B7(9) → B7(♭9) la novena (Do♯) baja a Do; en E7sus4 → E7 la 4ª (La) baja a la 3ª (Sol♯). La mano casi no se mueve."},
  {id:"b",n:"Puente",a:30,b:37,note:"<b>El puente se oscurece hacia lo menor.</b> Gm7 y Gm6 con el bajo en Si♭, Am7, B♭7sus4(9) y Fm6 con el bajo en La♭. A7(♯5) es el dominante que devuelve a Re: su quinta aumentada (Mi♯) sube un semitono hasta el Fa♯ de Dmaj7. La melodía de esta parte tiene tresillos: apréndelos escuchando una grabación."},
  {id:"a3",n:"A3",a:38,b:49,note:"<b>Última vuelta de la sección A</b>, con los mismos acordes que A1 y A2."},
  {id:"fin",n:"Final",a:50,b:58,note:"<b>El vaivén de la intro, ocho veces, y cierre en D(add9)</b>: Re mayor con la novena (Mi) añadida y calderón."}];

function waveVoice(c,v){
  const vv=v==="A"&&!canVoice(c.type,"A")?"fund":v,vs=voice(c.r,c.type,vv==="shell"&&!canVoice(c.type,"shell")?"fund":vv);
  const b=c.bass||c.r,bm=36+b.pc;
  const blab=c.bass?(TYPES[c.type].t.find(x=>(c.r.pc+x[0])%12===c.bass.pc)||[0,0,rootLet(c.bass)])[2]:"1";
  if(vv==="shell"&&c.bass)return{notes:vs.filter(x=>x.deg!==1&&pc(x.m)!==c.bass.pc),bass:{m:bm,lab:blab}};
  if(vv==="shell")return{notes:vs.filter(x=>x.deg!==1),bass:{m:vs[0].m,lab:"1"}};
  return{notes:vs,bass:{m:bm,lab:blab}};
}

function renderWave(){
  reset();setTab("wave");
  let sec=WSECS[1],a=sec.a,b=sec.b,pending=false,v="shell",style="block",bpm=60,loop=true,clk=true;
  const tr=Transport();onCleanup(()=>tr.stop());
  app.innerHTML=`<div class="t-j"><span class="eyebrow">Antonio Carlos Jobim · arreglo de Claus Ogerman</span><h2 class="vh">Wave</h2>
    <p class="lead muted">Los acordes de tu partitura, compás a compás y con su misma numeración. La melodía la lees de tu papel; aquí practicas la armonía y escuchas cómo suena el acompañamiento. <a href="https://www.jobim.org/jobim/bitstream/handle/2010/4994/wave.pdf?sequence=2" target="_blank" rel="noopener">Abrir la partitura en jobim.org</a></p>
    <div class="secs row" role="group" aria-label="Secciones">${WSECS.map(x=>`<button type="button" data-s="${x.id}">${x.n} <span class="muted" style="font-weight:500">${x.a}–${x.b}</span></button>`).join("")}<button type="button" data-s="all">Todo</button></div>
    <div class="wgrid"></div><div class="wsel muted" aria-live="polite"></div>
    <section class="ex"><div class="row">
      <label class="fld">Acompañamiento<select data-k="style"><option value="block">Acorde en cada cambio</option><option value="bossa">Ritmo de bossa</option></select></label>
      <label class="fld">Voicing<select data-k="v"><option value="shell">Shell, mano izquierda</option><option value="A">Sin fundamental + bajo</option><option value="fund">Posición fundamental</option></select></label>
      <label class="fld">Tempo (negra)<select data-k="bpm">${[44,52,60,72,84,100,120].map(x=>`<option${x===60?" selected":""}>${x}</option>`).join("")}</select></label></div>
      <div class="row" style="margin-top:12px"><button class="btn pri" type="button" data-a="play">▶ Reproducir</button><button class="btn sm" type="button" data-a="loop" aria-pressed="true">Repetir: sí</button><button class="btn sm" type="button" data-a="clk" aria-pressed="true">Clic: sí</button></div>
      <div class="wnow"><span class="csym">—</span><span class="wnext"></span></div><div class="cname wname"></div><div class="tones"></div>
      <div class="legend"><span><i style="background:var(--guide)"></i>notas guía (3ª y 7ª)</span><span><i style="background:var(--accent)"></i>resto del acorde</span><span><i style="background:var(--muted)"></i>bajo</span></div>
      <div class="kbh"></div></section>
    <div class="idea secnote"></div>
    <details class="box"><summary>Cómo estudiarla con esta partitura</summary><ol>
      <li><b>Intro (2–5):</b> el vaivén Dm7 – G7(13) con shells en la izquierda. Suena a Wave desde el primer día.</li>
      <li><b>Sección A (6–17) con shells</b>, de cuatro en cuatro compases, a 44–60 de tempo, hasta que los cambios salgan sin mirar.</li>
      <li><b>Melodía de la A con la derecha sola</b>, leyendo tu partitura: clave de Sol con dos sostenidos (Fa♯ y Do♯).</li>
      <li><b>Juntas:</b> melodía en la derecha y un shell en la izquierda en cada cambio de acorde, muy despacio.</li>
      <li><b>Puente (30–37)</b> con el mismo método. Después, el ritmo de bossa en la izquierda.</li>
      <li>El arreglo de Ogerman tal como está escrito, con las voces interiores de la derecha y los saltos de la izquierda, es de nivel intermedio-avanzado. Déjalo para cuando lo anterior te salga con soltura.</li></ol></details></div>`;
  const $=q=>app.querySelector(q),grid=$(".wgrid");
  const kb=Keyboard($(".kbh"),{from:36,to:81});
  const sym=c=>`${rootLet(c.r)}<span class="q">${c.q}${c.slash?"/"+c.slash:""}</span>`;
  function drawGrid(){
    const show=sec?WAVE.filter(x=>x.n>=sec.a&&x.n<=sec.b):WAVE;let h="",cur=null;
    show.forEach(x=>{const s=WSECS.find(z=>x.n>=z.a&&x.n<=z.b);if(!sec&&s!==cur){cur=s;h+=`<div class="wsec">${s.n}</div>`;}
      h+=`<button type="button" class="wbar${x.n>=a&&x.n<=b?" in":""}" data-n="${x.n}"><span class="bn">${x.n}</span><span class="ch">${x.ch.length?x.ch.map(sym).join("<br>"):'<span class="muted" style="font-size:14px">sin acorde</span>'}</span></button>`;});
    grid.innerHTML=h;
    $(".wsel").textContent=pending?`Inicio en el compás ${a}. Toca el compás final.`:`Seleccionado: compases ${a}–${b}. Toca un compás para empezar otra selección.`;
    app.querySelectorAll(".secs button").forEach(x=>x.setAttribute("aria-pressed",sec?x.dataset.s===sec.id:x.dataset.s==="all"));
    $(".secnote").innerHTML=`<span class="eyebrow">${sec?sec.n:"Forma completa"}</span>${sec?sec.note:"<b>Intro · A1 · A2 · Puente · A3 · Final.</b> 58 compases; la sección A ocupa 36 de ellos."}`;
  }
  function showChord(c,next){
    if(!c){$(".csym").textContent="—";$(".wname").textContent="";$(".tones").innerHTML="";kb.clear();$(".wnext").innerHTML="";return;}
    const w=waveVoice(c,v);$(".csym").innerHTML=sym(c);$(".wname").textContent=chordName(c.r,c.type)+(c.bass?` con el bajo en ${rootSol(c.bass)}`:"");
    $(".tones").innerHTML=toneChips(c.r,w.notes)+(c.bass?`<div class="tone"><span class="dg">bajo</span><span class="nm">${rootLet(c.bass)}</span><span class="sl">${rootSol(c.bass)}</span></div>`:"");
    $(".wnext").innerHTML=next?`Siguiente: <b>${sym(next)}</b>`:"";
    kb.clear();w.notes.forEach(x=>kb.mark(x.m,x.lab,isGuide(x.lab)?"guide":""));kb.mark(w.bass.m,w.bass.lab,"bass");kb.center([w.bass.m,...w.notes.map(x=>x.m)]);
  }
  const range=()=>WAVE.filter(x=>x.n>=a&&x.n<=b);
  const nextChord=(bars,bi,ci)=>{const bar=bars[bi];if(bar.ch[ci+1])return bar.ch[ci+1];for(let k=1;k<=bars.length;k++){const nb=bars[(bi+k)%bars.length];if(nb.ch.length)return nb.ch[0];}return null;};
  function playChord(c,time,dur){const w=waveVoice(c,style==="bossa"&&v==="shell"?"A":v);w.notes.forEach(x=>playNote(x.m,time,dur,.68));if(v!=="shell"||c.bass)playNote(w.bass.m,time,dur,.78);else playNote(w.bass.m,time,dur,.72);}
  function stop(){tr.stop();grid.querySelectorAll(".now").forEach(e=>e.classList.remove("now"));$('[data-a="play"]').textContent="▶ Reproducir";}
  function start(){
    const bars=range(),total=bars.length*8,g=tr.gen+1,RH=[0,3,6,10,13];
    tr.start({bpm,stepsPerBeat:2,onStep:(s,time)=>{const alive=()=>tr.running&&tr.gen===g,e8=60/bpm/2;
      if(s<8){if(s%2===0)click(time,s===0);if(s===0)at(time,()=>$(".wsel").textContent="Cuenta: 1, 2, 3, 4…",alive);return;}
      const k=s-8;if(!loop&&k>=total){at(time,stop,alive);return;}
      const bi=Math.floor(k/8)%bars.length,st=k%8,bar=bars[bi],ci=bar.ch.length===2&&st>=4?1:0,c=bar.ch[ci];
      if(clk&&st%2===0)click(time,st===0,.4);
      if(c){const chStart=st===0||(bar.ch.length===2&&st===4);
        if(style==="block"&&chStart)playChord(c,time,Math.min(4,(bar.ch.length===2?4:8)*e8*.97));
        if(style==="bossa"){if(RH.includes(k%16)){waveVoice(c,v==="shell"?"A":v).notes.forEach(x=>playNote(x.m,time,e8*1.6,.6));}
          if(st===0||st===4){const w=waveVoice(c,"A");let m=w.bass.m;if(st===4&&bar.ch.length===1&&!c.bass)m=m+7>50?m-5:m+7;playNote(m,time,e8*3.5,.8);}}
        if(chStart)at(time,()=>showChord(c,nextChord(bars,bi,ci)),alive);}
      else if(st===0)at(time,()=>showChord(null),alive);
      if(st===0)at(time,()=>{grid.querySelectorAll(".wbar").forEach(e=>e.classList.toggle("now",+e.dataset.n===bar.n));$(".wsel").textContent=`Compás ${bar.n}`;},alive);}});
    $('[data-a="play"]').textContent="■ Parar";
  }
  app.querySelector(".secs").addEventListener("click",e=>{const x=e.target.closest("[data-s]");if(!x)return;stop();pending=false;
    if(x.dataset.s==="all"){sec=null;a=1;b=58;}else{sec=WSECS.find(z=>z.id===x.dataset.s);a=sec.a;b=sec.b;}drawGrid();});
  grid.addEventListener("click",e=>{const x=e.target.closest(".wbar");if(!x)return;const n=+x.dataset.n;stop();
    if(!pending){a=b=n;pending=true;}else{if(n>=a)b=n;else{b=a;a=n;}pending=false;}
    drawGrid();const bar=WAVE.find(z=>z.n===n);if(bar.ch.length){showChord(bar.ch[0],bar.ch[1]||null);playChord(bar.ch[0],audio().currentTime+.02,1.8);}});
  app.querySelector(".ex").addEventListener("change",e=>{const k=e.target.dataset.k;if(!k)return;if(k==="style")style=e.target.value;if(k==="v")v=e.target.value;if(k==="bpm")bpm=+e.target.value;const was=tr.running;stop();if(was)start();});
  app.querySelector(".ex").addEventListener("click",e=>{const x=e.target.closest("[data-a]");if(!x)return;const k=x.dataset.a;
    if(k==="play")tr.running?stop():start();
    if(k==="loop"){loop=!loop;x.setAttribute("aria-pressed",loop);x.textContent="Repetir: "+(loop?"sí":"no");}
    if(k==="clk"){clk=!clk;x.setAttribute("aria-pressed",clk);x.textContent="Clic: "+(clk?"sí":"no");}});
  drawGrid();showChord(WAVE.find(x=>x.n===a).ch[0],WAVE.find(x=>x.n===a).ch[1]||WAVE.find(x=>x.n===a+1)?.ch[0]);
  window.scrollTo(0,0);
}

/* ---------- Vistas ---------- */
const app=document.getElementById("app");
function reset(){cleanups.forEach(f=>{try{f();}catch(e){}});cleanups=[];bus.handler=null;bus.kbs.clear();refreshDoneBtn=()=>{};}
function setTab(v){document.querySelectorAll(".tabs button").forEach(b=>{if(b.dataset.view===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});}
const nextLesson=()=>LESSONS.find(l=>!done[l.id]);

function renderHome(){
  reset();setTab("ruta");
  const n=LESSONS.filter(l=>done[l.id]).length,nx=nextLesson();
  const fj=LESSONS.findIndex(l=>l.track==="j");const cells=LESSONS.map((l,i)=>`<span class="${l.track}${done[l.id]?" done":""}${i===fj?" gap":""}" title="${l.title}"></span>`).join("");
  const list=t=>LESSONS.filter(l=>l.track===t).map((l,i)=>`<button class="lrow t-${t}" type="button" data-l="${l.id}"><span class="lnum">${i+1}</span><span><span class="lt">${l.title}</span><span class="ls">${l.sub}</span></span>${done[l.id]?'<span class="chip done">Aprendida</span>':nx&&nx.id===l.id?'<span class="chip next">Siguiente</span>':'<span class="chip">Pendiente</span>'}</button>`).join("");
  app.innerHTML=`<section class="goal t-c"><div class="staffbg"></div><div class="inner">
      <span class="eyebrow">Tu objetivo</span><div class="wave">Wave</div><div class="by">Antônio Carlos Jobim · bossa nova en Re mayor</div>
      <div class="stat"><span>${n} de ${LESSONS.length} lecciones aprendidas</span><span>Fundamentos · Jazz</span></div>
      <div class="cells" aria-hidden="true" style="grid-template-columns:repeat(${LESSONS.length},1fr)">${cells}</div>
      <div class="row">${nx?`<button class="btn pri" type="button" data-l="${nx.id}">Seguir: ${nx.title}</button>`:'<span class="chip done">Ruta completada: a por la partitura de Wave</span>'}<button class="btn" type="button" data-go="wave">Practicar Wave</button></div></div></section>
    <details class="box"><summary>Rutina diaria de 25 minutos</summary><ol>
      <li><span class="mins">3 min</span> · Calentamiento: posición de Do con cada mano, lento y sin tensión.</li>
      <li><span class="mins">5 min</span> · Técnica: escala de Do (luego Sol, Re y Fa) con metrónomo a 60.</li>
      <li><span class="mins">5 min</span> · Lectura: ejercicio de pentagrama aquí y dos líneas de un método impreso.</li>
      <li><span class="mins">7 min</span> · Armonía: los acordes de la lección actual, tocados en tu Roland.</li>
      <li><span class="mins">5 min</span> · Oído o ritmo, y termina tocando algo que te guste.</li></ol>
      <p class="muted" style="font-size:14px;margin:0 0 14px">Un método impreso para adultos (por ejemplo, el «Adult All-in-One» de Alfred) complementa bien esta app. Unas clases presenciales al principio te ahorran malos hábitos de postura.</p></details>
    ${["c","j"].map(t=>`<section class="track t-${t}"><span class="eyebrow">${TRACKS[t].long}</span><h2>${TRACKS[t].name}</h2><p>${TRACKS[t].desc}</p>${list(t)}</section>`).join("")}
    <p class="note">El progreso se guarda en este navegador. Si conectas tu FP-10 al móvil u ordenador por USB (o Bluetooth MIDI, si tu navegador lo permite), los ejercicios responden a tus teclas reales: usa «Conectar piano» arriba.</p>`;
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>renderLesson(b.dataset.l));
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
}

function renderLesson(id){
  reset();setTab("ruta");
  const i=LESSONS.findIndex(l=>l.id===id),l=LESSONS[i];if(!l){renderHome();return;}
  const num=LESSONS.filter(x=>x.track===l.track).indexOf(l)+1,prev=LESSONS[i-1],next=LESSONS[i+1];
  app.innerHTML=`<article class="lesson t-${l.track}"><button class="back" type="button">‹ Ruta</button>
    <div><span class="eyebrow">${TRACKS[l.track].name} · lección ${num}</span></div><h2>${l.title}</h2>
    <div class="prose">${l.body}</div><div class="widgets"></div>
    <div class="lfoot"><button class="btn" type="button" data-a="done"></button><div class="row">${prev?`<button class="btn" type="button" data-a="prev">‹ Anterior</button>`:""}${next?`<button class="btn pri" type="button" data-a="next">Siguiente ›</button>`:""}</div></div></article>`;
  app.querySelector(".back").onclick=renderHome;
  const db=app.querySelector('[data-a="done"]');
  refreshDoneBtn=()=>{db.textContent=done[id]?"Aprendida ✓ (desmarcar)":"Marcar como aprendida";db.classList.toggle("done",!!done[id]);};
  db.onclick=()=>{if(done[id])delete done[id];else done[id]=true;store.set("done",done);refreshDoneBtn();};
  refreshDoneBtn();
  app.querySelector('[data-a="prev"]')?.addEventListener("click",()=>renderLesson(prev.id));
  app.querySelector('[data-a="next"]')?.addEventListener("click",()=>renderLesson(next.id));
  l.w(app.querySelector(".widgets"),id);
  window.scrollTo(0,0);
}

function renderKeys(){
  reset();setTab("teclado");
  app.innerHTML=`<span class="eyebrow">Teclado libre</span><h2 style="font-family:var(--display);font-size:36px;margin:4px 0 6px;font-weight:600">Explora y escucha</h2>
    <p class="muted" style="max-width:60ch;margin:0 0 14px">Toca cualquier tecla (aquí o en tu Roland conectado) y verás su nombre, su lugar en el pentagrama y qué número de tecla es en tu piano de 88.</p>
    <section class="ex"><div class="lastnote"><div><div class="nm">—</div><div class="muted ln2">Toca una tecla</div></div><div class="staffbox"></div></div><div class="kbh"></div></section>`;
  const kb=Keyboard(app.querySelector(".kbh"),{from:36,to:84});
  bus.handler=m=>{app.querySelector(".nm").textContent=`${nameOf(m)}${oct(m)}`;app.querySelector(".ln2").textContent=`${letOf(m)}${oct(m)} · tecla ${m-20} de 88${m===60?" · Do central":""}`;
    app.querySelector(".staffbox").innerHTML=m>=36&&m<=84?staffSVG(m,m>=60?"treble":"bass"):"";};
  kb.center([55,67]);window.scrollTo(0,0);
}

function renderTools(){
  reset();setTab("herramientas");
  app.innerHTML=`<section class="tool"><h3>Metrónomo</h3><div class="row" style="justify-content:space-between;align-items:flex-end"><div><div class="bpm">72</div><div class="tempoterm">Andante</div></div>
      <label class="fld">Compás<select id="mbeats"><option value="2">2/4</option><option value="3">3/4</option><option value="4" selected>4/4</option></select></label></div>
      <input type="range" id="mbpm" min="40" max="200" value="72" aria-label="Pulsos por minuto">
      <div class="dots"></div>
      <div class="row"><button class="btn sm" type="button" data-d="-5">−5</button><button class="btn sm" type="button" data-d="-1">−1</button><button class="btn pri" type="button" id="mgo">▶ Empezar</button><button class="btn sm" type="button" data-d="1">+1</button><button class="btn sm" type="button" data-d="5">+5</button></div></section>
    <div class="t-j" id="exph"></div>
    <section class="tool"><h3>Conectar tu Roland</h3><p class="prose" style="margin:0">El FP-10 envía las notas por MIDI. Conéctalo con un cable USB (en el móvil, con adaptador OTG) o por Bluetooth MIDI y pulsa «Conectar piano». Funciona en Chrome o Edge para Android y ordenador; Safari en iPhone no lo admite. Si el navegador bloquea el acceso MIDI en esta página, todos los ejercicios siguen funcionando con el teclado de pantalla.</p></section>`;
  const tr=Transport();onCleanup(()=>tr.stop());
  let bpm=72,beats=4;
  const term=b=>b<60?"Largo":b<66?"Larghetto":b<76?"Adagio":b<108?"Andante":b<120?"Moderato":b<156?"Allegro":b<176?"Vivace":"Presto";
  const dots=app.querySelector(".dots"),go=app.querySelector("#mgo");
  const drawDots=()=>dots.innerHTML=Array.from({length:beats},()=>"<span></span>").join("");
  const upd=()=>{app.querySelector(".bpm").textContent=bpm;app.querySelector(".tempoterm").textContent=term(bpm);app.querySelector("#mbpm").value=bpm;tr.setBpm(bpm);};
  app.querySelector("#mbpm").oninput=e=>{bpm=+e.target.value;upd();};
  app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{bpm=Math.min(200,Math.max(40,bpm+ +b.dataset.d));upd();});
  app.querySelector("#mbeats").onchange=e=>{beats=+e.target.value;drawDots();};
  go.onclick=()=>{if(tr.running){tr.stop();go.textContent="▶ Empezar";dots.querySelectorAll("span").forEach(s=>s.classList.remove("on"));return;}
    const g=tr.gen+1;tr.start({bpm,onStep:(s,t)=>{const b=s%beats;click(t,b===0);at(t,()=>dots.querySelectorAll("span").forEach((d,i)=>d.classList.toggle("on",i===b)),()=>tr.running&&tr.gen===g);}});go.textContent="■ Parar";};
  drawDots();upd();
  explorer(app.querySelector("#exph"),{title:"Explorador de acordes",voicings:["fund","shell","A","B"]});
  window.scrollTo(0,0);
}
function go(v){if(v==="wave")renderWave();else if(v==="teclado")renderKeys();else if(v==="herramientas")renderTools();else renderHome();}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>go(b.dataset.view));

/* ---------- MIDI ---------- */
let midiOn=false;
const midiBtn=document.getElementById("midiBtn");
function onMidi(e){const[s,n,v]=e.data;if((s&0xf0)===0x90&&v>0){bus.kbs.forEach(k=>k.down(n));bus.input(n,null);}}
midiBtn.onclick=async()=>{
  audio();
  if(!navigator.requestMIDIAccess){toast("Este navegador no ofrece MIDI. Prueba con Chrome en Android o en el ordenador.");return;}
  try{const acc=await navigator.requestMIDIAccess();const bind=()=>{const ins=[...acc.inputs.values()];ins.forEach(i=>i.onmidimessage=onMidi);midiOn=ins.length>0;midiBtn.classList.toggle("on",midiOn);midiBtn.lastChild.textContent=midiOn?"Piano conectado":"Conectar piano";return ins;};
    acc.onstatechange=bind;const ins=bind();
    toast(ins.length?"Conectado: "+ins.map(i=>i.name).join(", "):"MIDI activo, pero no aparece ningún piano. Conecta el FP-10 por USB o Bluetooth MIDI y vuelve a pulsar.");}
  catch(err){toast("El acceso MIDI está bloqueado en esta página. Los ejercicios funcionan igual con el teclado de pantalla.");}
};

/* ---------- Inicio ---------- */
const h0=(location.hash||"").slice(1);
if(LESSONS.some(l=>l.id===h0))renderLesson(h0);else if(h0==="teclado"||h0==="herramientas"||h0==="wave")go(h0);else renderHome();
})();
</script>
